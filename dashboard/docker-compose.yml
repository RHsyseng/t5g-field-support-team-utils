---
version: "3.9"
services:
  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 30s
      retries: 10
    # Persist redis data so that you don't have to regather data
    volumes:
      - redis_data:/data
  ### PostgresQL
  postgresql:
    # pgvector build of postgres 18 on Debian trixie, matching postgres:latest
    # (same data layout and glibc collations, so existing volumes keep working).
    # The t5g-field-agents stack stores case embeddings here (vector extension).
    image: docker.io/pgvector/pgvector:pg18-trixie
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=dashboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgresql_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  ### Frontend
  dashboard-ui:
    image: localhost/dashboard
    build: .
    command: bash -c "gunicorn --bind 0.0.0.0:8080 --timeout 1200 wsgi:app --reload"
    env_file:
      - ../cfg/local.env
    ports:
      - 8080:8080
    environment:
      - FLASK_LOGIN_DISABLED=true  # Disable SSO Login for dev environments
      - FLASK_DEBUG=true
      # t5g-field-agents API for the AI Agent view (/agent). The agents stack joins
      # this project's dashboard_default network and exposes its api service as
      # "ai-agents". Without it running, /agent reports the service unavailable.
      - AI_AGENTS_API_URL=http://ai-agents:8081
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    volumes:
      # Reflect local changes immediately inside of container
      - ./src:/srv:Z

      # Prevent container from using local node_modules folder:
      - /srv/t5gweb/static/node_modules/

  ### Backend (can remove if only developing front end)

  # Gathers data if cache is empty
  init-cache:
    image: localhost/dashboard
    command: bash -c "flask init-cache"
    env_file:
      - ../cfg/local.env
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy

  # Gathers data on timed basis
  celery-worker:
    image: localhost/dashboard
    command: celery -A t5gweb.taskmgr worker --loglevel=info -E
    env_file:
      - ../cfg/local.env
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
  # Schedules celery-worker
  celery-beat:
    image: localhost/dashboard
    command: celery -A t5gweb.taskmgr beat -s /tmp/schedule
    env_file:
      - ../cfg/local.env
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy

  # Frontend for celery tasks
  flower:
    image: localhost/dashboard
    command: celery -A t5gweb.taskmgr flower --address=0.0.0.0 --port=8080 --purge_offline_workers=300
    ports:
      - 8000:8080
    env_file:
      - ../cfg/local.env
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
volumes:
  redis_data:
  postgresql_data:
